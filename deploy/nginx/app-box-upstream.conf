# api.mapleroutine.store 가 넘기는 서버(/etc/nginx/conf.d/maple-api-upstream.conf, http 블록 안).
# 2026-11-21 부터 DB 박스(10.0.0.192)의 nginx 8080 이다. 서버를 앱 박스로 옮기면 이 줄을 그 박스의 주소로 바꾼다.
# 연결을 다시 쓰려고 keepalive 를 둔다. 넘기는 location 은 Connection 헤더를 비워야 다시 쓴다.
upstream maple_api {
    server 10.0.0.192:8080;
    keepalive 8;
}
