# api.mapleroutine.store 가 include 하는 서버 경로(/etc/nginx/snippets/mapleroutine-api-upstream.conf).
#
# 루트가 쓰는 mapleroutine-api.conf 와 경로 · 점검 잠금의 동작 · 속도 제한이 같고, 넘기는 곳과 점검 파일만 다르다. upstream 은
# app-box-upstream.conf 에 있다. 서버가 있는 박스가 바뀌면 upstream 한 줄만 바꾼다. 1.0.15 앱은 api 주소를 보므로 주소는 그대로다
# (앱 저장소 ADR-016 결정 14). 1.0.15 로 전환할 때 루트도 이 파일을 쓰고 옛 파일을 지운다(앱 저장소 ADR-099 결정 64).
#
# 점검 잠금은 이 박스의 파일이다. 서버가 다른 박스에 있어도 앱 박스 nginx 가 답한다. 파일은 주소마다 따로라서, 이 파일을
# include 하는 server 블록이 먼저 `set $maintenance_dir <디렉터리>;` 를 둔다. 루트 주소는 /srv/maple-routine-maintenance, api 주소는
# /srv/maple-routine-maintenance/api 다(앱 저장소 ADR-261 결정 3). 1.0.15 로 전환할 때 api 를 먼저 잠그고 루트는 1.0.15 가 스토어에
# 나온 뒤에 잠그므로 둘을 따로 건다. 어느 server 블록에도 set 이 없으면 nginx -t 가 멈추지만, 한 블록에만 있으면 다른 블록은
# 빈 값으로 통과해 그 주소는 점검이 걸리지 않는다. 그래서 점검 스크립트가 켠 뒤 그 주소에 다시 물어 본다.

# 프렌즈 스트림. 서버가 NDJSON 을 gzip 으로 흘리므로 버퍼링과 재압축을 끄고, 하트비트 15초의
# 네 배를 읽기 시간으로 둔다(앱 저장소 ADR-347 결정 14). 속도 제한은 한 회차가 요청 1건이라 안 닿는다.
location = /v1/friends/stream {
    if (-f $maintenance_dir/maintenance.json) {
        return 503;
    }
    limit_req zone=notice_api burst=20 nodelay;

    proxy_buffering off;
    proxy_http_version 1.1;
    gzip off;
    proxy_pass http://maple_api;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
}

# 점검 상태. 이 주소의 파일이 있으면 점검 중이고 그 내용을 200 으로 낸다. 없으면 204 다.
# 서버가 아니라 nginx 가 답한다. 서버 컨테이너를 내린 동안에도 앱이 점검 중인 것을 알아야 하기 때문이다
# (앱 저장소 ADR-261, 서버 저장소 README 의 점검 잠금).
location = /v1/maintenance {
    root $maintenance_dir;
    add_header Cache-Control "no-store" always;
    try_files /maintenance.json =204;
}

# OTA 확인. 점검 중에도 서버로 넘기려고 /v1/ 에서 떼어 둔다. 잠금 코드가 없는 번들이 새 번들과 스토어 업데이트
# 판정을 받게 하려는 것이다. 나머지 줄은 아래 /v1/ 블록과 같다.
location /v1/ota/ {
    limit_req zone=notice_api burst=20 nodelay;
    # 매니페스트는 줄이지 않는다. 9KB 라 얻을 것이 적고, 잘못되면 모든 사용자가 업데이트를 못 받는다.
    gzip off;

    proxy_pass http://maple_api;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}

# 앱이 부르는 조회와 쓰기 전부. 같은 박스의 새 서버로 간다.
#
# **인증이 없다.** 공개 정보라서인데, 그래서 누구나 부를 수 있다. 속도 제한을 여기서 건다.
# burst 를 두는 것은 앱이 목록과 상세를 연달아 부르기 때문이다. nodelay 없이 두면 그 두 번째가
# 대기열에서 기다려 화면이 늦게 뜬다.
location /v1/ {
    if (-f $maintenance_dir/maintenance.json) {
        return 503;
    }
    limit_req zone=notice_api burst=20 nodelay;

    proxy_pass http://maple_api;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 서버가 죽어 있어도 앱이 오래 안 기다리게 한다. 앱은 기기에 쌓인 공지를 이미
    # 그리고 있어서, 조회가 늦게 실패하는 것보다 빨리 실패하는 편이 낫다. 넥슨 로그인 콜백은
    # 서버가 넥슨과 한 번 왕복하므로 10초 안에 든다.
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}

# 앱이 받는 그림. 서버가 /srv/maple-routine-assets 에 내용 해시 이름으로 쓴다(서버 저장소 README).
# 이름이 내용이라 바뀌지 않으므로 오래 캐시한다. 없는 파일을 / 의 정적 사이트로 넘기지 않는다.
# 그림과 OTA 파일은 서버가 있는 박스의 nginx 가 그 박스 디스크에서 낸다. 서버가 그림을 받아 쓰는 곳이 그 박스라서다.
location /assets/ {
    proxy_pass http://maple_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
}
location /ota/files/ {
    gzip off;
    proxy_pass http://maple_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
}
