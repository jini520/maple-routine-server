# DB 박스에서 서버 앞에 서는 nginx(/etc/nginx/sites-available/maple-routine-server). 앱 박스 nginx 의 upstream maple_api 가
# 여기로 넘긴다. 사설 IP 에만 열고, 앱 박스에서 오는 8080 만 방화벽(iptables · 오라클 보안 목록)이 받는다.
# 점검 잠금과 요청 속도 제한은 앱 박스 nginx 가 하므로 여기서는 하지 않는다.
server {
    listen 10.0.0.192:8080;
    server_name _;
    access_log /var/log/nginx/maple-routine-server.access.log;

    location /assets/ {
        alias /srv/maple-routine-assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /ota/files/ {
        alias /srv/maple-routine-ota/files/;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 앱 박스 nginx 가 붙인 요청자 주소와 https 를 그대로 넘긴다. 서버는 trustProxy 로 맨 앞 주소를 요청자로 읽는다.
    # 프렌즈 조회 스트림이 있어 버퍼링을 끈다.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}
